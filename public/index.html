<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <!-- ===== CAPACITOR / MOBILE APP ADDITIONS ===== -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#10b981">
  <meta name="apple-mobile-web-app-title" content="MSConnect">
  <link rel="manifest" href="/manifest.json">
  <!-- ============================================ -->

  <title>Milledgeville Connect</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-gradient-to-br from-slate-950 to-emerald-950 text-white min-h-screen font-sans">
  <div class="flex min-h-screen relative">

    <!-- DESKTOP SIDEBAR -->
    <div id="sidebar" class="hidden md:flex w-64 bg-white/10 backdrop-blur-xl border-r border-white/10 flex-col">
      <div class="p-6 flex items-center gap-3">
        <div class="w-10 h-10 bg-emerald-500 rounded-2xl flex items-center justify-center text-3xl">🏠</div>
        <h1 class="text-xl font-bold tracking-tight">Milledgeville Connect</h1>
      </div>
      <nav id="desktop-nav" class="flex-1 px-3"></nav>
      <div class="mx-4 mb-6" id="sidebar-user-area">
        <!-- Populated by renderNav() -->
      </div>
    </div>

    <!-- MAIN CONTENT AREA -->
    <div class="flex-1 min-w-0 flex flex-col overflow-hidden">
      <!-- Top Bar -->
      <div class="bg-white/10 backdrop-blur-xl border-b border-white/10 px-4 py-4 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center gap-2 md:hidden min-w-0 flex-shrink-0">
          <div class="w-9 h-9 bg-emerald-500 rounded-2xl flex items-center justify-center text-2xl flex-shrink-0">🏠</div>
          <h1 class="text-lg font-bold truncate">Milledgeville Connect</h1>
        </div>
        <div class="flex-1 min-w-0 mx-3 md:mx-0">
          <input id="globalSearchInput" type="text" placeholder="What are you looking for in Milledgeville?"
                 class="w-full bg-white/10 border border-white/20 rounded-3xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-400 placeholder:text-white/50">
          <div id="globalSearchResults" class="hidden absolute top-full mt-2 w-full bg-slate-900 border border-white/20 rounded-3xl shadow-2xl max-h-96 overflow-auto z-50"></div>
        </div>
        <div id="topbar-user-area" class="md:hidden flex-shrink-0"></div>
      </div>

      <!-- CONTENT WRAPPER -->
      <div id="mobileContentWrapper" class="flex-1 min-w-0 w-full overflow-x-hidden overflow-y-auto pb-20 md:pb-0">
        <div id="content" class="p-3 md:p-6 w-full min-w-0" style="max-width:100%;box-sizing:border-box;overflow-x:hidden;"></div>
      </div>

      <!-- MOBILE BOTTOM NAV -->
      <div id="mobile-nav" class="md:hidden fixed bottom-0 left-0 right-0 bg-white/10 backdrop-blur-xl border-t border-white/10 flex justify-around py-2 z-40"></div>
    </div>
  </div>

<!-- PROFILE SLIDE-UP SHEET -->
<div onclick="if(event.target.id==='profileSheet')hideProfileSheet()" id="profileSheet"
     class="hidden fixed inset-0 bg-black/60 z-[11000] flex items-end">
  
  <div id="profileSheetPanel"
       onclick="event.stopImmediatePropagation()"
       class="bg-[#0f172a] text-white border-t border-white/10 w-full rounded-t-3xl max-h-[92vh] overflow-auto transition-transform duration-300 translate-y-full">

    <!-- Drag handle -->
    <div class="sticky top-0 bg-[#0f172a] pt-4 pb-2 flex justify-center z-10 rounded-t-3xl">
      <div class="w-12 h-1.5 bg-white/30 rounded-full"></div>
    </div>

    <div class="px-6 pb-10">
      <div id="sheet-content"></div>
    </div>
  </div>
</div>

  <!-- AUTH MODAL — must be in DOM before scripts run -->
  <div id="authModal" onclick="if(event.target.id==='authModal')hideAuthModal()"
       class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-[10000]">
    <div onclick="event.stopImmediatePropagation()"
         class="bg-white text-slate-900 rounded-3xl max-w-md w-full mx-4 shadow-2xl">
      <div class="p-8">
        <h2 id="modalTitle" class="text-3xl font-bold mb-6 text-center">Welcome back</h2>
        
        <div id="loginForm">
          <input id="loginEmail" type="email" placeholder="Email"
                 class="w-full mb-3 px-5 py-4 rounded-3xl border border-slate-200 focus:border-emerald-500 outline-none">
          <input id="loginPassword" type="password" placeholder="Password"
                 class="w-full mb-6 px-5 py-4 rounded-3xl border border-slate-200 focus:border-emerald-500 outline-none">
          <button onclick="handleLogin()"
                  class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-4 rounded-3xl font-semibold text-lg transition">Log In</button>
          <p onclick="switchToForgotPassword()" class="text-center text-sm mt-3 text-slate-400 cursor-pointer hover:text-slate-600">Forgot password?</p>
          <p onclick="switchToRegister()" class="text-center text-sm mt-3 text-emerald-600 cursor-pointer">Don't have an account? Register</p>
        </div>

        <!-- FORGOT PASSWORD PANEL -->
        <div id="forgotPasswordForm" class="hidden">
          <!-- Step 1: enter email -->
          <div id="forgotStep1">
            <p class="text-sm text-slate-500 mb-4 text-center">Enter your email and we'll show your security question.</p>
            <input id="forgotEmail" type="email" placeholder="Email"
                   class="w-full mb-4 px-5 py-4 rounded-3xl border border-slate-200 focus:border-emerald-500 outline-none">
            <button onclick="handleForgotStep1()"
                    class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-4 rounded-3xl font-semibold text-lg transition">Continue</button>
          </div>
          <!-- Step 2: answer question + new password -->
          <div id="forgotStep2" class="hidden">
            <p id="forgotQuestionText" class="text-sm font-semibold text-slate-700 mb-3 text-center bg-slate-50 rounded-2xl px-4 py-3"></p>
            <input id="forgotAnswer" type="text" placeholder="Your answer"
                   class="w-full mb-3 px-5 py-4 rounded-3xl border border-slate-200 focus:border-emerald-500 outline-none">
            <input id="forgotNewPassword" type="password" placeholder="New password"
                   class="w-full mb-3 px-5 py-4 rounded-3xl border border-slate-200 focus:border-emerald-500 outline-none">
            <input id="forgotConfirmNewPassword" type="password" placeholder="Confirm new password"
                   class="w-full mb-6 px-5 py-4 rounded-3xl border border-slate-200 focus:border-emerald-500 outline-none">
            <button onclick="handleForgotStep2()"
                    class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-4 rounded-3xl font-semibold text-lg transition">Reset Password</button>
          </div>
          <p onclick="switchToLogin()" class="text-center text-sm mt-6 text-slate-400 cursor-pointer hover:text-slate-600">← Back to login</p>
        </div>

        <div id="registerForm" class="hidden">
          <input id="regName" type="text" placeholder="Full Name"
                 class="w-full mb-3 px-5 py-4 rounded-3xl border border-slate-200 focus:border-emerald-500 outline-none">
          <input id="regEmail" type="email" placeholder="Email"
                 class="w-full mb-3 px-5 py-4 rounded-3xl border border-slate-200 focus:border-emerald-500 outline-none">
          <input id="regPassword" type="password" placeholder="Password"
                 class="w-full mb-3 px-5 py-4 rounded-3xl border border-slate-200 focus:border-emerald-500 outline-none">
          <input id="regConfirmPassword" type="password" placeholder="Confirm Password"
                 class="w-full mb-3 px-5 py-4 rounded-3xl border border-slate-200 focus:border-emerald-500 outline-none">
          <select id="regSecurityQuestion"
                  class="w-full mb-3 px-5 py-4 rounded-3xl border border-slate-200 focus:border-emerald-500 outline-none text-slate-700 bg-white">
            <option value="">Select a security question...</option>
            <option value="street">What street did you grow up on?</option>
            <option value="pet">What was your first pet's name?</option>
            <option value="maiden">What is your mother's maiden name?</option>
            <option value="city">What city were you born in?</option>
            <option value="school">What elementary school did you attend?</option>
            <option value="car">What was the make of your first car?</option>
          </select>
          <input id="regSecurityAnswer" type="text" placeholder="Your answer (used to reset password)"
                 class="w-full mb-6 px-5 py-4 rounded-3xl border border-slate-200 focus:border-emerald-500 outline-none">
          <button onclick="handleRegister()"
                  class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-4 rounded-3xl font-semibold text-lg transition">Create Account</button>
          <p onclick="switchToLogin()" class="text-center text-sm mt-6 text-emerald-600 cursor-pointer">Already have an account? Log in</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts load after all HTML is parsed -->
  <script src="/js/api.js"></script>
  <script src="/js/security.js"></script>
  <script src="/js/data.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/profile.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/main.js"></script>

  <script>
    // ─── PWA Install Banner ───────────────────────────────────────────────────
    // Works on: Chrome/Edge/Samsung Browser (beforeinstallprompt)
    //           iOS Safari (user-agent detection)
    //           Firefox + others (generic nudge on mobile viewports)
    // Hidden:   already running in standalone/installed mode
    //           dismissed within the last 7 days
    (function () {
      // Already installed as PWA — never show
      var isStandalone =
        window.matchMedia('(display-mode: standalone)').matches ||
        navigator.standalone === true ||
        document.referrer.indexOf('android-app://') === 0;
      if (isStandalone) return;

      // Dismissed recently
      var dismissedAt = parseInt(localStorage.getItem('mcInstallDismissed') || '0', 10);
      if (Date.now() - dismissedAt < 7 * 24 * 60 * 60 * 1000) return;

      var deferredPrompt = null;

      function createBanner(mode) {
        if (document.getElementById('mcInstallBanner')) return;

        var isIOS = mode === 'ios';
        var banner = document.createElement('div');
        banner.id = 'mcInstallBanner';
        banner.style.cssText = [
          'position:fixed',
          'bottom:72px',          /* sits above the 64px mobile bottom nav */
          'left:50%',
          'transform:translateX(-50%)',
          'width:calc(100% - 32px)',
          'max-width:480px',
          'background:linear-gradient(135deg,#064e3b,#065f46)',
          'border:1px solid rgba(52,211,153,0.35)',
          'border-radius:20px',
          'padding:14px 16px',
          'display:flex',
          'align-items:center',
          'gap:12px',
          'z-index:89000',
          'box-shadow:0 8px 32px rgba(0,0,0,0.5)',
        ].join(';');

        var msg = isIOS
          ? 'Tap <strong>Share</strong> then <strong>"Add to Home Screen"</strong>'
          : 'Add to your home screen for the best experience';

        banner.innerHTML =
          '<span style="font-size:1.6rem;flex-shrink:0;">📲</span>' +
          '<div style="flex:1;min-width:0;">' +
            '<p style="font-weight:700;font-size:.85rem;color:#fff;margin:0 0 2px;">Install Milledgeville Connect</p>' +
            '<p style="font-size:.75rem;color:rgba(255,255,255,.7);margin:0;line-height:1.4;">' + msg + '</p>' +
          '</div>' +
          (isIOS ? '' :
            '<button id="mcInstallBtn" style="background:#10b981;color:#fff;border:none;border-radius:12px;' +
            'padding:10px 16px;font-weight:700;font-size:.8rem;white-space:nowrap;cursor:pointer;' +
            'touch-action:manipulation;flex-shrink:0;">Install</button>') +
          '<button id="mcDismissBtn" style="background:none;border:none;color:rgba(255,255,255,.5);' +
          'font-size:1.4rem;cursor:pointer;padding:4px;line-height:1;touch-action:manipulation;flex-shrink:0;">×</button>';

        document.body.appendChild(banner);

        document.getElementById('mcDismissBtn').onclick = function () {
          localStorage.setItem('mcInstallDismissed', Date.now().toString());
          banner.remove();
        };

        var installBtn = document.getElementById('mcInstallBtn');
        if (installBtn) {
          installBtn.onclick = function () {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then(function (choice) {
              deferredPrompt = null;
              banner.remove();
              if (choice.outcome === 'accepted') {
                localStorage.setItem('mcInstallDismissed', Date.now().toString());
              }
            });
          };
        }
      }

      // Chrome / Edge / Samsung Browser
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferredPrompt = e;
        createBanner('chromium');
      });

      // Installed via prompt — remove banner
      window.addEventListener('appinstalled', function () {
        var b = document.getElementById('mcInstallBanner');
        if (b) b.remove();
        localStorage.setItem('mcInstallDismissed', Date.now().toString());
      });

      // iOS Safari — beforeinstallprompt never fires
      var ua = navigator.userAgent || '';
      var isIosSafari =
        /iphone|ipad|ipod/i.test(ua) &&
        /safari/i.test(ua) &&
        !/crios|fxios|opios|mercury/i.test(ua);
      if (isIosSafari) {
        setTimeout(function () { createBanner('ios'); }, 2500);
      }

      // Firefox / other mobile browsers — show nudge if no prompt fired after 4s
      var promptFired = false;
      window.addEventListener('beforeinstallprompt', function () { promptFired = true; }, { once: true });
      setTimeout(function () {
        if (promptFired || isIosSafari || isStandalone) return;
        if (document.getElementById('mcInstallBanner')) return;
        if (window.innerWidth > 900) return;  // desktop — skip
        createBanner('other');
      }, 4000);
    })();
  </script>
</body>
</html>
