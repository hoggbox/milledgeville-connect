<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notification Scheduler • Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-zinc-950 text-white">

  <div class="max-w-5xl mx-auto px-6 py-8">
    <div class="flex items-center justify-between mb-8">
      <div>
        <h1 class="text-3xl font-bold flex items-center gap-3">
          <i class="fa-solid fa-bell text-violet-500"></i> 
          Notification Scheduler
        </h1>
        <p class="text-white/50">Admin Only Tool</p>
      </div>
    </div>

    <div id="content">
      <!-- Content loads here after admin check -->
    </div>
  </div>

  <script>
    // ==================== ADMIN VERIFICATION ====================
    async function verifyAdminAccess() {
      const token = localStorage.getItem('token');
      if (!token) {
        showAccessDenied("You are not logged in.");
        return false;
      }

      try {
        // Try to call an admin-only endpoint
        const res = await fetch('/api/admin/stats', {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        if (res.ok) {
          // If the request succeeds, user is admin
          console.log('%c[Scheduler] ✅ Admin verified via backend', 'color:#4ade80');
          loadSchedulerUI();
          return true;
        } else {
          showAccessDenied("You do not have admin access.");
          return false;
        }
      } catch (err) {
        console.error(err);
        showAccessDenied("Could not verify admin status.");
        return false;
      }
    }

    function showAccessDenied(message) {
      document.getElementById('content').innerHTML = `
        <div class="max-w-md mx-auto bg-zinc-900 border border-white/10 rounded-3xl p-8 text-center">
          <i class="fa-solid fa-lock text-5xl text-red-400 mb-4"></i>
          <h2 class="text-2xl font-bold mb-2">Access Denied</h2>
          <p class="text-white/60 mb-6">${message}</p>
          
          <button onclick="goBackToApp()" 
                  class="w-full py-3.5 bg-white/10 hover:bg-white/20 rounded-2xl font-medium transition">
            Return to App
          </button>
        </div>
      `;
    }

    function goBackToApp() {
      window.location.href = '/';
    }

    function loadSchedulerUI() {
      document.getElementById('content').innerHTML = `
        <div class="bg-zinc-900 border border-white/10 rounded-3xl p-8">
          <h3 class="font-semibold text-lg mb-4">Create Notification</h3>
          <p class="text-white/60">Scheduler UI will load here once we finish connecting the form.</p>
          
          <!-- We can add the full form later -->
        </div>
      `;
    }

    // Run verification when page loads
    verifyAdminAccess();
  </script>

</body>
</html>
